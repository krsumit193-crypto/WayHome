name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Maven Central occasionally answers 429 while CI warms its cache.
      # Retry a couple of times instead of failing a healthy build.
      - name: Build and test
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if mvn -B -ntp verify; then
              exit 0
            fi
            echo "Maven attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
