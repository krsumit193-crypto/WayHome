services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: railhop
      POSTGRES_USER: railhop
      POSTGRES_PASSWORD: railhop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railhop -d railhop"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/railhop
      DB_USER: railhop
      DB_PASSWORD: railhop
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Phase 5: uncomment when you add caching (spring-boot-starter-data-redis).
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:
